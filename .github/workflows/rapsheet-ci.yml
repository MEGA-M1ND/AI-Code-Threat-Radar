name: rapsheet

on:
  push:
    paths:
      - "rapsheet/**"
      - ".github/workflows/rapsheet-ci.yml"
  pull_request:
    paths:
      - "rapsheet/**"
      - ".github/workflows/rapsheet-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: rapsheet

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Validate entries
        run: python scripts/validate.py
      - name: Build feed
        run: python scripts/build.py
      - name: Tests
        run: python -m pytest tests/
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: rapsheet-dist
          path: rapsheet/dist/
          if-no-files-found: error
