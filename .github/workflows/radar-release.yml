name: radar-release

# Two ways in, one code path.
#
#   1. Push a tag matching radar-v*  — the normal route for a maintainer
#      working locally.
#   2. Run this workflow from the Actions UI with a tag name — the route that
#      works when the caller cannot push to refs/tags/*, which is the case for
#      agent sessions and for anyone behind a credential that scopes writes to
#      refs/heads/*. gh creates the tag as part of creating the release.
#
# Either way the artifacts are built and tested here, in CI, from the commit
# being released. Nothing is uploaded from a contributor's machine.

on:
  push:
    tags:
      - "radar-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release, e.g. radar-v0.1.0"
        required: true
        type: string

# Everything this workflow needs and nothing else: create a tag, create a
# release, upload assets. No packages, no id-token, no actions, no issues.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Third-party and first-party actions alike are pinned by commit SHA.
      # A moving tag is a supply-chain hole, and this repository exists to
      # catalogue those.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve and check the tag name
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          case "$TAG" in
            radar-v*) ;;
            *) echo "::error::tag must start with radar-v, got '$TAG'"; exit 1 ;;
          esac
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG from $GITHUB_SHA"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Build and test
        run: |
          python scripts/validate.py
          python scripts/build_feed.py
          python -m pytest tests/

      - name: Checksums
        run: |
          cd dist
          sha256sum *.json > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          # Glob rather than enumerate. An explicit file list silently drops a
          # new per-category feed the moment a category is added to the schema,
          # which is exactly how feed-malicious-package.json was missing from
          # radar-v0.1.0 while SHA256SUMS still listed it.
          shopt -s nullglob
          ASSETS=(dist/*.json dist/SHA256SUMS)
          echo "Attaching ${#ASSETS[@]} assets:"; printf '  %s\n' "${ASSETS[@]}"

          # Every category the build knows about must have produced a file.
          EXPECTED=$(python -c "import sys; sys.path.insert(0,'scripts'); import build_feed; print(len(build_feed.CATEGORIES))")
          FOUND=$(ls dist/feed-*.json | wc -l)
          if [ "$EXPECTED" -ne "$FOUND" ]; then
            echo "::error::expected $EXPECTED per-category feeds, found $FOUND"; exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets with --clobber"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              TARGET=()
            else
              TARGET=(--target "$GITHUB_SHA")
            fi
            gh release create "$TAG" "${TARGET[@]}" \
              --title "$TAG" \
              --generate-notes \
              "${ASSETS[@]}"
          fi
