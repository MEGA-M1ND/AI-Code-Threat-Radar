name: radar

on:
  push:
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/**"
      - "tests/**"
      - "examples/**"
      - "pyproject.toml"
      - ".github/workflows/radar-ci.yml"
  pull_request:
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/**"
      - "tests/**"
      - "examples/**"
      - "pyproject.toml"
      - ".github/workflows/radar-ci.yml"
  workflow_dispatch:

# This job only reads the repository. It never needs to write anything.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA. A moving tag is a supply-chain hole, and this
      # repository exists to catalogue those.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Validate entries
        run: python scripts/validate.py

      - name: Build feed
        run: python scripts/build_feed.py

      - name: Tests
        run: python -m pytest tests/

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: radar-dist
          path: dist/
          if-no-files-found: error
