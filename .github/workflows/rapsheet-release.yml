name: rapsheet-release

# Tag a release as rapsheet-v0.1.0 and the built feed is attached to it.
# Consumers should point at the "latest" URL documented in docs/FEED.md
# rather than at a specific tag.
on:
  push:
    tags:
      - "rapsheet-v*"

permissions:
  contents: write

defaults:
  run:
    working-directory: rapsheet

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Build and test
        run: |
          python scripts/build.py
          python -m pytest tests/
      - name: Checksums
        run: |
          cd dist
          sha256sum *.json > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rapsheet/dist/*.json
            rapsheet/dist/SHA256SUMS
          generate_release_notes: true
