[project]
name = "rapsheet"
version = "0.1.0"
description = "A public database of supply-chain threats in the AI coding agent ecosystem."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/MEGA-M1ND/AI-Code-Threat-Radar/tree/main/rapsheet"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Rapsheet is a data repository with two scripts, not an importable package.
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
