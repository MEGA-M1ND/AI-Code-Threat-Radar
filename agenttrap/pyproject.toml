[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenttrap"
version = "0.1.0"
description = "Do coding agents fall for supply-chain traps while doing ordinary work?"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
# No runtime dependencies. The harness shells out to the agent under test and
# does everything else with the standard library.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
agenttrap = "agenttrap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agenttrap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
